name: Approved data release

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: "Checksum-pinned filename from data/source_manifest.json"
        required: true
        type: choice
        options:
          - MoMTSim_20240722202413_1000_dataset.csv
          - synthetic_mobile_money_transaction_dataset.csv

jobs:
  release:
    environment: approved-data-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group dev
      - run: uv run guardrails data fetch --destination data/raw
      - run: uv run guardrails data profile --source data/raw/MoMTSim_20240722202413_1000_dataset.csv --source data/raw/synthetic_mobile_money_transaction_dataset.csv --out data/approved/profile.json
      - run: uv run guardrails data build --source data/raw/${{ inputs.source_file }}
      - run: uv run pytest -q && uv run python scripts/run_evaluation.py
      - run: mkdir -p benchmarks && uv run python scripts/run_benchmark.py --snapshot data/approved/payments.duckdb
      - uses: actions/upload-artifact@v4
        with:
          name: approved-snapshot
          path: |
            data/approved/payments.duckdb
            data/approved/payments.metadata.json
            data/approved/profile.json
            data/source_manifest.json
            benchmarks/latest.json

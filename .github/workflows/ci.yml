name: Validate project
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check . && uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python scripts/run_evaluation.py && uv run python scripts/validate_manifest.py
      - run: test -s portfolio/assets/system.png && test -f architecture/system.mmd
      - run: "! rg -n '(AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----)' --glob '!uv.lock' ."

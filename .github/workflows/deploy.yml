name: Deploy verified Text-to-SQL revision

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional 40-character source revision; defaults to the triggering commit
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: text-to-sql-anonymous-live-release
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-text-to-sql-guardrails-dev
  REGISTRY: textsqlguardrails278f1d
  IMAGE_REPOSITORY: text-to-sql-guardrails
  CONTAINER_APP: ca-text-sql-guardrails-dev
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  deploy:
    environment: anonymous-live-demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact revision
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(printf '%s' "$SOURCE_SHA" | wc -c)" -eq 40
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check . && uv run ruff check . && uv run pytest -q
      - run: uv run python scripts/run_evaluation.py && uv run python scripts/validate_manifest.py
      - name: Verify container data boundary
        run: |
          docker build --tag "text-to-sql-release:$SOURCE_SHA" .
          docker run --rm --entrypoint python "text-to-sql-release:$SOURCE_SHA" /app/scripts/verify_container_boundary.py
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build immutable Azure image
        run: >
          az acr build
          --registry "$REGISTRY"
          --image "$IMAGE_REPOSITORY:$SOURCE_SHA"
          .
      - name: Deploy exact image and verify
        run: |
          image="$REGISTRY.azurecr.io/$IMAGE_REPOSITORY:$SOURCE_SHA"
          digest="$(az acr repository show --name "$REGISTRY" --image "$IMAGE_REPOSITORY:$SOURCE_SHA" --query digest --output tsv)"
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP" \
            --image "$image" \
            --set-env-vars "PORTFOLIO_SOURCE_SHA=$SOURCE_SHA" \
            --output none
          revision="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP" --query properties.latestReadyRevisionName --output tsv)"
          fqdn="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP" --query properties.configuration.ingress.fqdn --output tsv)"
          for attempt in $(seq 1 30); do
            payload="$(curl --fail --silent --show-error "https://$fqdn/v1/status" || true)"
            if printf '%s' "$payload" | jq -e --arg sha "$SOURCE_SHA" '.source_sha == $sha' >/dev/null; then
              break
            fi
            test "$attempt" -lt 30
            sleep 10
          done
          uv run python scripts/verify_deployment.py \
            --base-url "https://$fqdn" \
            --revision "$revision" \
            --image "$image" \
            --digest "$digest" \
            --source-sha "$SOURCE_SHA" \
            --out artifacts/release-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: text-to-sql-release-${{ env.SOURCE_SHA }}
          path: artifacts/release-receipt.json
          if-no-files-found: error
